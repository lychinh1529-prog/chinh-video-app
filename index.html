<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8ff">
  <meta name="description" content="Chinh Video Downloader - công cụ hỗ trợ tải video từ YouTube, Douyin, Bilibili và TikTok.">
  <title>Chinh Video Downloader</title>
  
  <!-- SDK Firebase Gốc Giữ Nguyên -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Sửa lại đường dẫn CDN Font Awesome chính xác thay vì Cloudflare lỗi -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="style.css">

  <style>
    /* CSS ĐIỀU HƯỚNG TAB & MENU ĐÁY ĐỘC LẬP */
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 0; color: #1e293b; }
    .container { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; box-sizing: border-box; margin-top: 50px; }
    input { width: 90%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 95%; padding: 12px; font-size: 16px; background: #fe2c55; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #e0244d; }
    #result { margin-top: 20px; text-align: left; word-break: break-all; }

    .app-tab-content { display: none; }
    .app-tab-content.active { display: block; }
    
    .bottom-nav-custom {
      display: none; /* Mặc định ẩn, chỉ hiển thị bằng JS sau khi đăng nhập thành công */
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
      justify-content: space-around; align-items: center; padding: 10px 0;
      background: #0b0f19; border-top: 1px solid #1e293b;
    }
    .nav-btn-custom {
      background: none; border: none; color: #64748b; font-size: 11px;
      display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1;
    }
    .nav-btn-custom.active { color: #00d2ff; }
    .nav-btn-custom i { font-size: 18px; margin-bottom: 3px; }
    .fix-padding-bottom { padding-bottom: 80px !important; }

    /* CSS GIAO DIỆN STUDIO FULLSCREEN TỐI GIẢN */
    .edit-fullscreen-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #090d16; z-index: 100000; flex-direction: column; overflow: hidden; color: #ffffff; text-align: left;
    }
    .edit-fullscreen-modal.active { display: flex; }
    .studio-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0b0f19; border-bottom: 1px solid #1e293b; }
    .studio-close-btn { color: #ff4d4d; font-size: 22px; cursor: pointer; background: none; border: none; font-weight: bold; }
    .studio-export-btn { background: #00e5ff; color: #000; border: none; font-weight: bold; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .studio-view { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 10px; }
    .studio-frame-916 { width: 100%; max-width: 270px; aspect-ratio: 9/16; background: #161b22; border-radius: 8px; border: 1px solid #30363d; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .studio-timeline { background: #0b0f19; padding: 12px; border-top: 1px solid #1e293b; }
    .timeline-track { height: 36px; background: #161b22; border-radius: 6px; border: 1px solid #30363d; margin-top: 4px; display: flex; align-items: center; padding: 0 10px; }
    .studio-tools { display: flex; gap: 10px; padding: 12px; background: #0b0f19; overflow-x: auto; }
    .tool-btn { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 8px; min-width: 80px; text-align: center; font-size: 11px; color: #c9d1d9; cursor: pointer; }
    .tool-btn i { display: block; font-size: 16px; margin-bottom: 4px; color: #00e5ff; }

    /* Lớp phủ màn hình Auth */
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f4f9; z-index: 99999; display: flex; justify-content: center; align-items: center; }
    .auth-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 380px; box-sizing: border-box; text-align: center; }
  </style>
</head>

<body>

  <!-- ================= MÀN HÌNH ĐĂNG NHẬP GỐC ================= -->
  <div id="authScreen" class="auth-overlay" style="display: flex;">
    <div class="auth-card">
      <h2 style="font-size: 18px; color: #fe2c55; margin-bottom: 5px;">CHINH VIDEO DOWNLOADER</h2>
      <p style="font-size: 13px; color: #64748b; margin-top: 0; margin-bottom: 20px;">Đăng nhập tài khoản</p>

      <div class="input-group" style="margin-bottom: 15px;">
        <input type="text" id="authUsername" placeholder="Nhập tên tài khoản (ID)..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box;" />
      </div>
      
      <div class="input-group" style="margin-bottom: 10px; position: relative;">
        <input type="password" id="authPassword" placeholder="Nhập mật khẩu..." style="width: 100%; padding: 12px; padding-right: 45px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box;" />
        <span id="eyeIcon" onclick="togglePasswordVisibility('authPassword', 'eyeIcon')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px;">👁️</span>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <button type="button" onclick="handleForgotPassword()" style="background: none; border: none; color: #075de0; cursor: pointer; font-size: 14px; padding: 0;">Quên mật khẩu?</button>
      </div>

      <button class="btn btn-primary full-width" onclick="handleLogin()" style="margin-bottom: 10px; width: 100%; padding: 12px;">Đăng nhập</button>
      <button class="btn btn-light full-width" onclick="showAuthSection('register')" style="width: 100%; padding: 12px; background: #cbd5e1; color: #1e293b;">Tạo tài khoản mới</button>
      
      <p id="authMessage" class="auth-msg" style="color: #e53e3e; text-align: center; margin-top: 15px; font-size: 14px;"></p>
    </div>
  </div>

  <!-- ================= MÀN HÌNH ĐĂNG KÝ GỐC ================= -->
  <div id="registerSection" class="auth-overlay" style="display: none;">
    <div class="auth-card">
      <h2 style="font-size: 18px; color: #fe2c55;">CHINH VIDEO DOWNLOADER</h2>
      <p class="auth-subtitle">Tạo tài khoản mới</p>

      <div class="input-group" style="margin-bottom: 15px;">
        <input type="text" id="regUsername" placeholder="Tạo tên tài khoản (ID không trùng)..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box;" />
      </div>
      
      <div class="input-group" style="margin-bottom: 20px; position: relative;">
        <input type="password" id="regPassword" placeholder="Tạo mật khẩu..." style="width: 100%; padding: 12px; padding-right: 45px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box;" />
        <span id="regEyeIcon" onclick="togglePasswordVisibility('regPassword', 'regEyeIcon')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px;">👁️</span>
      </div>

      <button class="btn btn-primary full-width" onclick="handleSignup()" style="margin-bottom: 10px; width: 100%; padding: 12px;">Tạo tài khoản</button>
      <button class="btn btn-light full-width" onclick="showAuthSection('login')" style="width: 100%; padding: 12px; background: #cbd5e1; color: #1e293b;">Quay lại Đăng nhập</button>
      
      <p id="regMessage" class="auth-msg" style="text-align: center; margin-top: 15px; font-size: 14px;"></p>
    </div>
  </div>

  <!-- ================= CÁC MÀN HÌNH CHỨC NĂNG CHÍNH SAU ĐĂNG NHẬP ================= -->

  <!-- TAB 1: TẢI VIDEO (Tích hợp logic GET chuẩn của bạn) -->
  <div id="tab-downloader" class="app-tab-content active fix-padding-bottom" style="display: none;">
    <div class="container">
        <h2>Tải Video Không Logo</h2>
        <input type="text" id="videoUrl" placeholder="Dán link TikTok vào đây...">
        <button onclick="getVid()">Lấy Video</button>
        <div id="result"></div>
    </div>
  </div>

  <!-- TAB 2: STUDIO FULLSCREEN MÀN HÌNH ẨN -->
  <div id="tab-studio" class="edit-fullscreen-modal">
    <div class="studio-header">
      <button class="studio-close-btn" onclick="closeStudioTab()">×</button>
      <div style="text-align: center;">
        <h4 style="margin: 0; font-size: 14px;">CHINH LY STUDIO</h4>
        <p style="margin: 0; font-size: 10px; color: #64748b;">Editor Tool v2.0</p>
      </div>
      <button class="studio-export-btn">Xuất file</button>
    </div>
    <div class="studio-view">
      <div class="studio-frame-916">
        <i class="fa-solid fa-clapperboard" style="font-size: 36px; color: #30363d; margin-bottom: 8px;"></i>
        <span style="color: #64748b; font-size: 12px;">Chưa chọn video xử lý</span>
      </div>
    </div>
    <div class="studio-timeline">
      <div class="timeline-track">
        <span style="font-size: 11px; color: #64748b;">Dòng thời gian video (Timeline)</span>
      </div>
    </div>
    <div class="studio-tools">
      <button class="tool-btn"><i class="fa-solid fa-music"></i>Đổi nhạc</button>
      <button class="tool-btn"><i class="fa-solid fa-closed-captioning"></i>Chèn chữ</button>
