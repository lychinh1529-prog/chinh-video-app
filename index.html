<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHINH VIDEO DOWNLOADER & EDITOR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-light: #F8FAFC;
      --card-white: #FFFFFF;
      --primary-blue: #0066FF;
      --secondary-blue: #E6F0FF;
      --text-dark: #0F172A;
      --text-gray: #64748B;
      --border-color: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 70px; }

    /* HEADER MAIN */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; background: var(--card-white);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 36px; height: 36px; background: var(--primary-blue); color: #fff;
      border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .brand-title h1 { font-size: 16px; font-weight: 700; color: var(--text-dark); }
    .brand-title h1 span { color: var(--primary-blue); }
    .brand-title p { font-size: 11px; color: var(--text-gray); }

    /* CONTAINER & HOME TAB */
    .container { padding: 16px; max-width: 500px; margin: 0 auto; }
    .card {
      background: var(--card-white); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .input-box {
      width: 100%; padding: 12px; border: 1px solid var(--border-color);
      border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none;
    }
    .btn-blue {
      width: 100%; background: var(--primary-blue); color: white; border: none;
      padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* FULLSCREEN EDIT MODAL (GIAO DIỆN EDIT TOÀN MÀN HÌNH) */
    .edit-fullscreen-page {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000000; z-index: 999; flex-direction: column; overflow: hidden;
    }
    .edit-fullscreen-page.active { display: flex; }

    /* EDIT HEADER WITH CLOSE BUTTON 'X' */
    .edit-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: rgba(15, 23, 42, 0.9); color: #fff;
    }
    .edit-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .close-edit-btn {
      background: rgba(255,255,255,0.2); color: #fff; border: none;
      width: 32px; height: 32px; border-radius: 50%; font-size: 18px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* VIDEO PREVIEW HOLDER (HỖ TRỢ 16:9 VÀ 9:16) */
    .video-viewport {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #090D16; position: relative; overflow: hidden; padding: 10px;
    }
    /* Khung chứa video tự co giãn khớp tỷ lệ */
    .video-container-box {
      max-width: 100%; max-height: 100%; aspect-ratio: 9/16; background: #1E293B;
      border-radius: 12px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #94A3B8; position: relative; border: 1px dashed #334155;
    }
    .video-container-box.aspect-16-9 { aspect-ratio: 16/9; width: 100%; }

    /* AI SUBTITLE OVERLAY PREVIEW */
    .subtitle-overlay {
      position: absolute; bottom: 20px; left: 10px; right: 10px; text-align: center;
      background: rgba(0,0,0,0.6); color: #FFD700; padding: 6px 10px;
      border-radius: 6px; font-size: 13px; font-weight: 700; text-shadow: 1px 1px 2px #000;
    }

    /* BOTTOM TOOLBAR PANEL (MÀU SÁNG & XANH) */
    .edit-bottom-panel {
      background: var(--card-white); border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    
    .timeline-bar {
      height: 36px; background: var(--secondary-blue); border-radius: 8px;
      border: 1px solid var(--border-color); display: flex; align-items: center;
      justify-content: center; font-size: 12px; color: var(--primary-blue); font-weight: 600;
    }

    /* DANH SÁCH CÔNG CỤ EDIT */
    .tools-scroll-list {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px;
    }
    .tool-item-btn {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: var(--bg-light); border: 1px solid var(--border-color);
      padding: 10px 14px; border-radius: 12px; cursor: pointer; min-width: 80px;
    }
    .tool-item-btn i { font-size: 20px; color: var(--primary-blue); }
    .tool-item-btn span { font-size: 11px; font-weight: 600; color: var(--text-dark); }

    /* BOTTOM NAV MAIN */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-white);
      border-top: 1px solid var(--border-color); display: flex; justify-content: space-around;
      padding: 10px 0; z-index: 100;
    }
    .nav-btn {
      background: none; border: none; display: flex; flex-direction: column;
      align-items: center; gap: 4px; color: var(--text-gray); font-size: 11px; cursor: pointer;
    }
    .nav-btn.active { color: var(--primary-blue); font-weight: 600; }
    .nav-btn i { font-size: 18px; }
  </style>
</head>
<body>

  <!-- HEADER TRANG CHỦ -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo"><i class="fa-solid fa-download"></i></div>
      <div class="brand-title">
        <h1>CHINH <span>VIDEO</span></h1>
        <p>Downloader & AI Editor</p>
      </div>
    </div>
  </header>

  <!-- NỘI DUNG TRANG CHỦ -->
  <div class="container">
    <div class="card">
      <h3 style="margin-bottom: 10px; font-size: 15px;">Tải Video Ngay</h3>
      <input type="text" class="input-box" placeholder="Dán link TikTok, YouTube, Douyin...">
      <button class="btn-blue"><i class="fa-solid fa-arrow-down"></i> Tải Video</button>
    </div>
  </div>

  <!-- GIAO DIỆN CHỈNH SỬA EDIT FULLSCREEN (MỞ KHI BẤM NÚT EDIT) -->
  <div id="edit-modal" class="edit-fullscreen-page">
    
    <!-- EDIT HEADER VỚI NÚT 'X' QUAY LẠI -->
    <div class="edit-header">
      <div class="edit-title">
        <i class="fa-solid fa-scissors" style="color: var(--primary-blue);"></i> Studio Biên Tập Video
      </div>
      <button class="close-edit-btn" onclick="closeEditStudio()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- KHUNG XEM TRƯỚC VIDEO (16:9 & 9:16) -->
    <div class="video-viewport">
      <div id="video-box" class="video-container-box">
        <i class="fa-solid fa-file-video" style="font-size: 40px; margin-bottom: 10px;"></i>
        <p style="font-size: 13px;">Nhấn vào để chọn Video từ máy</p>
        <input type="file" id="video-file-input" accept="video/*" hidden onchange="handleVideoUpload(this)">
        
        <!-- PHỤ ĐỀ DỊCH AI MẪU KHỚP VIDEO -->
        <div id="sub-preview" class="subtitle-overlay" style="display:none;">
          [Gemini AI Sub]: Chào mừng bạn đến với ứng dụng!
        </div>
      </div>
    </div>

    <!-- THANH CÔNG CỤ DƯỚI CÙNG (MÀU SÁNG + XANH) -->
    <div class="edit-bottom-panel">
      <!-- TIMELINE CẮT VIDEO -->
      <div class="timeline-bar">
        <i class="fa-solid fa-film" style="margin-right: 8px;"></i> Timeline Cắt Video: 00:00 - 00:15
      </div>

      <!-- DANH SÁCH CÔNG CỤ -->
      <div class="tools-scroll-list">
        <div class="tool-item-btn" onclick="triggerGeminiTranslate()">
          <i class="fa-solid fa-language"></i>
          <span>Dịch phụ đề AI</span>
        </div>
        <div class="tool-item-btn" onclick="toggleAspectRatio()">
          <i class="fa-solid fa-mobile-screen"></i>
          <span>Tỷ lệ 9:16 / 16:9</span>
        </div>
        <div class="tool-item-btn">
          <i class="fa-solid fa-scissors"></i>
          <span>Cắt video</span>
        </div>
        <div class="tool-item-btn">
          <i class="fa-solid fa-font"></i>
          <span>Thêm văn bản</span>
        </div>
        <div class="tool-item-btn">
          <i class="fa-solid fa-bolt"></i>
          <span>Tốc độ</span>
        </div>
      </div>

      <button class="btn-blue" style="margin-top: 4px;">
        <i class="fa-solid fa-export"></i> Xuất Video Đã Sửa
      </button>
    </div>

  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="closeEditStudio()">
      <i class="fa-solid fa-house"></i>
      <span>Trang chủ</span>
    </button>
    <button class="nav-btn" onclick="openEditStudio()">
      <i class="fa-solid fa-scissors"></i>
      <span>Chỉnh sửa</span>
    </button>
  </nav>

  <!-- JAVASCRIPT ĐIỀU HƯỚNG VÀ XỬ LÝ -->
  <script>
    // Mở trang Studio Edit Full màn hình
    function openEditStudio() {
      document.getElementById('edit-modal').classList.add('active');
    }

    // Nút X đóng Studio quay lại trang chủ
    function closeEditStudio() {
      document.getElementById('edit-modal').classList.remove('active');
    }

    // Đổi tỷ lệ khung hình video 9:16 <-> 16:9
    function toggleAspectRatio() {
      const box = document.getElementById('video-box');
      box.classList.toggle('aspect-16-9');
    }

    // Giả lập tính năng Gửi tới Gemini AI dịch phụ đề Tiếng Trung sang Việt
    function triggerGeminiTranslate() {
      const sub = document.getElementById('sub-preview');
      sub.style.display = 'block';
      sub.innerText = "Đang gửi yêu cầu tới Gemini AI dịch & tối ưu phụ đề Trung -> Việt...";
      
      setTimeout(() => {
        sub.innerText = "Gemini AI: Phụ đề Tiếng Việt đã khớp với khẩu hình!";
      }, 1500);
    }

    // Chọn video từ điện thoại
    document.getElementById('video-box').addEventListener('click', function() {
      document.getElementById('video-file-input').click();
    });

    function handleVideoUpload(input) {
      if (input.files && input.files[0]) {
        alert("Đã chọn video: " + input.files[0].name + ". Sẵn sàng biên tập!");
      }
    }
  </script>

</body>
</html>
