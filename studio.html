<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>CHINH LY - Studio Biên Tập Video</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16; color: #ffffff; font-family: sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* Header Studio */
    .studio-top-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #0b0f19; border-bottom: 1px solid #1e293b;
    }
    .studio-close-x {
      color: #ff4d4d; font-size: 22px; cursor: pointer; font-weight: bold; background: none; border: none;
      text-decoration: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    }
    .studio-export-btn {
      background: #00e5ff; color: #000000; border: none; font-weight: bold;
      padding: 6px 16px; border-radius: 20px; font-size: 14px; cursor: pointer;
    }

    /* Viewport Video Dọc 9:16 */
    .studio-viewport-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #090d16; position: relative; padding: 10px; overflow: hidden;
    }
    .studio-video-frame-916 {
      width: 100%; max-width: 280px; aspect-ratio: 9/16; background: #161b22;
      border-radius: 8px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; position: relative; border: 1px solid #30363d;
    }
    .studio-sub-badge {
      position: absolute; bottom: 15px; background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2); padding: 6px 10px; border-radius: 8px;
      font-size: 11px; color: #fff; text-align: center; width: 85%;
    }

    /* Timeline cắt video */
    .studio-timeline-panel {
      background: #0b0f19; padding: 10px 16px; border-top: 1px solid #1e293b;
    }
    .timeline-bar {
      height: 40px; background: #161b22; border-radius: 6px; display: flex;
      align-items: center; justify-content: space-between; padding: 0 8px;
      border: 1px solid #30363d; margin-top: 6px;
    }

    /* Công cụ nhanh */
    .studio-quick-tools {
      display: flex; gap: 10px; padding: 10px 16px; background: #0b0f19; overflow-x: auto;
    }
    .quick-tool-card {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 8px 12px; min-width: 90px; text-align: center; font-size: 11px; cursor: pointer; color: #c9d1d9;
    }
    .quick-tool-card i { display: block; font-size: 16px; margin-bottom: 4px; color: #00e5ff; }

    /* 5 Tab công cụ dưới cùng chuẩn ảnh */
    .studio-bottom-tabs {
      display: flex; justify-content: space-around; background: #000000;
      padding: 10px 0; border-top: 1px solid #1e293b;
    }
    .studio-tab-item {
      display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #8b949e; cursor: pointer; background: none; border: none;
    }
    .studio-tab-item i { font-size: 16px; margin-bottom: 3px; }
    .studio-tab-item.active { color: #ffffff; }
  </style>
</head>
<body>

  <!-- Header Studio -->
  <div class="studio-top-header">
    <a href="index.html" class="studio-close-x">✕</a>
    <button class="studio-export-btn" onclick="alert('Đang tiến hành xuất video...')">Xuất</button>
  </div>

  <!-- Viewport Video Dọc 9:16 -->
  <div class="studio-viewport-area">
    <div class="studio-video-frame-916">
      <div style="position: absolute; top: 10px; left: 10px; font-size: 10px; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px;">9:16</div>
      <i class="fa-solid fa-video" style="font-size: 28px; color: #8b949e; margin-bottom: 6px;"></i>
      <p style="font-size: 11px; color: #8b949e; text-align: center; padding: 0 10px;">Nhấn để chọn Video</p>
      <div class="studio-sub-badge">
        ✨ Cuộc sống thật đẹp, chỉ cần bạn dũng cảm tiến về phía trước
      </div>
    </div>
  </div>

  <!-- Timeline cắt video -->
  <div class="studio-timeline-panel">
    <div style="font-size: 11px; color: #8b949e; display: flex; justify-content: space-between;">
      <span><i class="fa-solid fa-scissors"></i> Timeline Cắt Video: 00:00 - 00:15</span>
      <span>00:15</span>
    </div>
    <div class="timeline-bar">
      <span style="font-size: 10px; color: #8b949e;">00:00</span>
      <div style="flex: 1; height: 28px; background: #30363d; margin: 0 8px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #00e5ff;">[ Khung hình Video Clip ]</div>
      <span style="font-size: 10px; color: #8b949e;">00:15</span>
    </div>
  </div>

  <!-- Công cụ nhanh -->
  <div class="studio-quick-tools">
    <div class="quick-tool-card" onclick="alert('Tắt tiếng video')">
      <i class="fa-solid fa-volume-xmark"></i>
      <span>Tắt tiếng</span>
    </div>
    <div class="quick-tool-card" onclick="alert('Thêm âm thanh / Nhạc')">
      <i class="fa-solid fa-music"></i>
      <span>Thêm âm thanh</span>
    </div>
    <div class="quick-tool-card" onclick="alert('Thêm văn bản')">
      <i class="fa-solid fa-font"></i>
      <span>Thêm văn bản</span>
    </div>
  </div>

  <!-- 5 Tab công cụ dưới cùng đúng chuẩn ảnh -->
  <div class="studio-bottom-tabs">
    <button class="studio-tab-item active" onclick="alert('Tab: Chỉnh sửa')">
      <i class="fa-solid fa-scissors"></i>
      <span>Chỉnh sửa</span>
    </button>
    <button class="studio-tab-item" onclick="alert('Tab: Âm thanh')">
      <i class="fa-solid fa-music"></i>
      <span>Âm thanh</span>
    </button>
    <button class="studio-tab-item" onclick="alert('Tab: Văn bản')">
      <i class="fa-solid fa-font"></i>
      <span>Văn bản</span>
    </button>
    <button class="studio-tab-item" onclick="alert('Tab: Lớp phủ')">
      <i class="fa-solid fa-layer-group"></i>
      <span>Lớp phủ</span>
    </button>
    <button class="studio-tab-item" onclick="alert('Tab: Phụ đề')">
      <i class="fa-solid fa-closed-captioning"></i>
      <span>Phụ đề</span>
    </button>
  </div>

</body>
</html>
